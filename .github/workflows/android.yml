# Builds the signed Closer Desk Android app whenever android/ changes on main and publishes it as a
# GitHub Release. Install it with Obtainium pointed at this repo; it then updates like a normal app.
#
# Repo Actions secrets:
#   CD_KEYSTORE_B64       base64 of the release keystore (alias "closerdesk")
#   CD_KEYSTORE_PASSWORD  keystore and key password
#   CD_SERVER_URL         the Closer Desk address the sign-in screen starts on (optional)
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CD_VERSION_BASE: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keystore
        run: echo "${{ secrets.CD_KEYSTORE_B64 }}" | base64 -d > release.keystore

      - name: Build signed APK
        run: gradle assembleRelease
        env:
          CD_KEYSTORE: release.keystore
          CD_KEYSTORE_PASSWORD: ${{ secrets.CD_KEYSTORE_PASSWORD }}
          CD_SERVER_URL: ${{ secrets.CD_SERVER_URL }}

      - name: Name it
        run: cp app/build/outputs/apk/release/app-release.apk closer-desk-v${{ env.CD_VERSION_BASE }}.${{ github.run_number }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.CD_VERSION_BASE }}.${{ github.run_number }}
          name: Closer Desk Android ${{ env.CD_VERSION_BASE }}.${{ github.run_number }}
          body: Signed build from ${{ github.sha }}. Install or update with Obtainium.
          files: android/closer-desk-v${{ env.CD_VERSION_BASE }}.${{ github.run_number }}.apk
